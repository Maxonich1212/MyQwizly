<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Habit Quizly" />
    <meta name="description" content="Трекер привычек и карточки с интервальными повторениями" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>My Habit Quizly</title>
    <style>
      /* Заглушка до загрузки скриптов — совпадает с компонентом Splash */
      :root { --boot-bg: #f2f3f6; }
      @media (prefers-color-scheme: dark) { :root { --boot-bg: #141519; } }
      html, body { margin: 0; background: var(--bg, var(--boot-bg)); }
      .splash { position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; background: var(--bg, var(--boot-bg)); }
      .splash-logo { width: 84px; height: 84px; border-radius: 30%; display: grid; place-items: center;
        background: linear-gradient(135deg, #7c7eff, #a855f7 60%, #ec4899); box-shadow: 0 18px 44px -12px rgba(168, 85, 247, 0.7); }
      .splash-dots { display: flex; gap: 7px; }
      .splash-dots i { width: 11px; height: 11px; border-radius: 30%; background: rgba(127, 127, 140, 0.18); animation: splashDot 1.4s ease-in-out infinite; }
      @keyframes splashDot { 0%, 100% { background: rgba(127, 127, 140, 0.18); transform: scale(1); } 40% { background: var(--c); transform: scale(1.2); box-shadow: 0 0 10px var(--c); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash">
        <div class="splash-logo">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="splash-dots">
          <i style="--c:#f4c34a"></i><i style="--c:#f2706b;animation-delay:.12s"></i><i style="--c:#6fd98a;animation-delay:.24s"></i><i style="--c:#5ab1f5;animation-delay:.36s"></i><i style="--c:#a284f5;animation-delay:.48s"></i><i style="--c:#ec7bb8;animation-delay:.6s"></i><i style="--c:#5ccbe8;animation-delay:.72s"></i>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
